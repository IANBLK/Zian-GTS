name: Release Zian GTS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate tag matches mod version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2-)"
          EXPECTED_TAG="v${VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match mod_version ${VERSION}. Expected ${EXPECTED_TAG}."
            exit 1
          fi

      - name: Build release
        run: ./gradlew clean build --stacktrace

      - name: Select distributable JAR
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2-)"
          JAR="build/libs/zian-gts-${VERSION}.jar"
          test -f "$JAR"
          echo "RELEASE_JAR=$JAR" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Generate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cd build/libs
          sha256sum "zian-gts-${RELEASE_VERSION}.jar" > "zian-gts-${RELEASE_VERSION}.jar.sha256"

      - name: Upload release build artifact
        uses: actions/upload-artifact@v6
        with:
          name: zian-gts-${{ github.ref_name }}
          path: |
            build/libs/zian-gts-${{ env.RELEASE_VERSION }}.jar
            build/libs/zian-gts-${{ env.RELEASE_VERSION }}.jar.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="Zian GTS ${RELEASE_VERSION}"
          PRERELEASE_ARGS=()
          if [[ "${RELEASE_VERSION}" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            "${RELEASE_JAR}" \
            "build/libs/zian-gts-${RELEASE_VERSION}.jar.sha256" \
            --title "$TITLE" \
            --notes-file CHANGELOG.md \
            --verify-tag \
            "${PRERELEASE_ARGS[@]}"
