name: Build Zian GTS

on:
  push:
    branches:
      - main
      - dev/reconstruction
      - 'feat/**'
      - 'rewrite/**'
      - 'audit/**'
  pull_request:
    branches:
      - main
      - dev/reconstruction
      - 'rewrite/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Print failed test reports
        if: failure()
        run: find build/test-results/test -name '*.xml' -type f -exec cat {} +

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: zian-gts-failure-diagnostics-${{ github.run_number }}
          path: |
            build/test-results/**
            build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Beta 2 JARs
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: zian-gts-1.0.0-beta.2
          path: build/libs/*.jar
          if-no-files-found: error
