name: Build Zian GTS

on:
  push:
    branches:
      - main
      - dev/reconstruction
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Print failed test reports
        if: failure()
        run: find build/test-results/test -name '*.xml' -type f -exec cat {} +

      - name: Upload JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zian-gts-dev
          path: build/libs/*.jar
          if-no-files-found: error
